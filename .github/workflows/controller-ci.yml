name: Controller integrity tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python syntax and safety contract
        run: |
          python3 -m py_compile scripts/select_issue.py
          python3 -m unittest discover -s tests -v
