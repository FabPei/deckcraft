name: Publish approved DeckCraft PR

# Intentionally ONLY manual: approving this workflow is the human PR gate.
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Upstream issue number from a PR approval issue (e.g. 69)'
        required: true
        type: number

permissions:
  contents: read
  issues: read

concurrency:
  group: deckcraft-pr-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check approved candidate, source fork and open issue
        id: validate
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          CONTROL_REPO: ${{ github.repository }}
          CONTRIBUTION_REPO: ${{ vars.CONTRIBUTION_REPO || 'FabPei/deckcraft-contrib' }}
          GH_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          CONTROL_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "A positive issue number is required"; exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "CONTRIBUTION_TOKEN not configured"; exit 1
          fi
          parent=$(gh api "repos/$CONTRIBUTION_REPO" --jq '.parent.full_name')
          visibility=$(gh api "repos/$CONTRIBUTION_REPO" --jq '.private')
          if [ "$parent" != 'storytold/deckcraft' ] || [ "$visibility" != 'false' ]; then
            echo 'Contribution repository must be a genuine PUBLIC fork'; exit 1
          fi
          if ! gh api "repos/$CONTRIBUTION_REPO/git/ref/heads/agent/issue-$ISSUE_NUMBER" >/dev/null 2>&1; then
            echo "No approved code branch exists for issue $ISSUE_NUMBER"; exit 1
          fi
          # The private approval issue must have been created by the successful coding workflow.
          expected_sha=$(GH_TOKEN="$CONTROL_TOKEN" gh api "repos/$CONTROL_REPO/issues?state=open&per_page=100" \
            --jq '.[] | select(.title == "PR approval: upstream #'"$ISSUE_NUMBER"'") | .body' \
            | sed -n 's/^Commit: \([0-9a-f]\{40\}\)$/\1/p' | head -1)
          actual_sha=$(gh api "repos/$CONTRIBUTION_REPO/git/ref/heads/agent/issue-$ISSUE_NUMBER" --jq '.object.sha')
          if [ -z "$expected_sha" ] || [ "$expected_sha" != "$actual_sha" ]; then
            echo "No valid approval record for this exact commit SHA; refusing PR creation"; exit 1
          fi
          state=$(gh api "repos/storytold/deckcraft/issues/$ISSUE_NUMBER" --jq '.state')
          if [ "$state" != 'open' ]; then
            echo "Upstream issue $ISSUE_NUMBER is no longer open"; exit 1
          fi
          title=$(gh api "repos/storytold/deckcraft/issues/$ISSUE_NUMBER" --jq '.title')
          echo "issue_title=$title" >> "$GITHUB_OUTPUT"

      - name: Check for an already-open upstream contribution
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          GH_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, sys
          n = int(os.environ['ISSUE_NUMBER'])
          data = json.loads(subprocess.check_output([
              'gh','api','repos/storytold/deckcraft/pulls?state=open&per_page=100']))
          pat = re.compile(r'(?:fix(?:es|ed)?|clos(?:es|ed)?|issue|for)\s*:?#'+str(n)+r'\b|\(#'+str(n)+r'\)', re.I)
          for pr in data:
              if pat.search((pr.get('title') or '') + '\n' + (pr.get('body') or '')):
                  print('Existing upstream PR possibly addresses the issue: '+pr['html_url'])
                  sys.exit(1)
          PY

      - name: Create upstream pull request after explicit manual approval
        env:
          GH_TOKEN: ${{ secrets.CONTRIBUTION_TOKEN }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ISSUE_TITLE: ${{ steps.validate.outputs.issue_title }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "Fixes storytold/deckcraft#$ISSUE_NUMBER"
            echo ""
            echo "This contribution was prepared in an isolated checkout of upstream main."
            echo "It passed DeckCraft's full `cargo xtask ci` quality gate and an independent agent review before the code branch was published."
            echo ""
            echo "The contributor manually approved opening this PR. Maintainers retain final review and merge control."
            echo ""
            echo "Related upstream issue: https://github.com/storytold/deckcraft/issues/$ISSUE_NUMBER"
          } > pr-body.md
          gh pr create -R storytold/deckcraft \
            --base main \
            --head "FabPei:agent/issue-$ISSUE_NUMBER" \
            --title "fix: $ISSUE_TITLE (#$ISSUE_NUMBER)" \
            --body-file pr-body.md
